<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Aggregator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="app" class="max-w-6xl mx-auto px-4 py-6">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-blue-700 flex items-center gap-2">
        <i data-lucide="newspaper" class="w-8 h-8 text-blue-600"></i>
        News Aggregator
      </h1>
      <div class="flex flex-wrap items-center gap-3">
        <label for="category-select" class="text-sm font-medium text-slate-600">Category</label>
        <select id="category-select" class="bg-white border border-slate-300 rounded-lg px-4 py-2 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 transition"></select>
        <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg shadow-sm transition flex items-center gap-2">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Refresh
        </button>
      </div>
    </header>

    <div id="loading-indicator" class="flex justify-center items-center py-20">
      <div class="loader"></div>
    </div>

    <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <div id="error-message" class="hidden text-center py-12 text-red-600 font-medium text-lg"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
