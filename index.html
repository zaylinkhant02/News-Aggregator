<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Aggregator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gradient-to-br from-slate-50 via-slate-100/60 to-slate-50 text-slate-800 font-sans antialiased min-h-screen">
  <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <header class="bg-white/80 backdrop-blur-md border border-slate-200/80 rounded-2xl p-4 sm:p-6 shadow-sm mb-8 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 transition-all">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-blue-600/10 border border-blue-500/20 rounded-xl text-blue-600 flex items-center justify-center shadow-inner">
          <i data-lucide="newspaper" class="w-7 h-7"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-slate-900">News Aggregator</h1>
          <div class="flex items-center gap-2">
            <p class="text-xs font-medium text-slate-500">Live headlines & top stories</p>
            <span class="text-slate-300">•</span>
            <span id="last-updated" class="text-xs font-medium text-slate-400">Updated just now</span>
          </div>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 flex-1 lg:max-w-2xl lg:justify-end">
        <form id="search-form" class="relative flex-1">
          <input id="search-input" type="text" placeholder="Search news..." class="w-full bg-slate-100/80 border border-slate-200 text-slate-800 text-sm rounded-xl pl-10 pr-10 py-2.5 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
          <button type="button" id="clear-search" class="hidden absolute right-3 top-3 text-slate-400 hover:text-slate-600">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </form>

        <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
          <div class="flex items-center gap-2 bg-slate-100/80 p-1.5 rounded-xl border border-slate-200">
            <label for="category-select" class="text-xs font-semibold uppercase tracking-wider text-slate-500 pl-2">Category</label>
            <select id="category-select" class="bg-white border border-slate-200 text-slate-700 font-medium rounded-lg px-3 py-1.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"></select>
          </div>

          <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="bg-slate-100/80 hover:bg-slate-200 border border-slate-200 text-slate-600 font-medium px-3 py-2.5 rounded-xl transition flex items-center justify-center">
            <i data-lucide="moon" id="theme-toggle-dark-icon" class="w-4 h-4"></i>
            <i data-lucide="sun" id="theme-toggle-light-icon" class="w-4 h-4 hidden"></i>
          </button>

          <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-sm shadow-blue-500/20 transition flex items-center gap-2">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <main>
      <div id="featured-story" class="mb-8"></div>

      <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <div id="scroll-sentinel" class="py-10 flex justify-center items-center">
        <div id="sentinel-loader" class="loader hidden"></div>
      </div>

      <div id="error-message" class="hidden text-center py-16 px-6 bg-red-50 border border-red-200 rounded-2xl text-red-600 font-medium text-base shadow-sm max-w-lg mx-auto mt-8"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
